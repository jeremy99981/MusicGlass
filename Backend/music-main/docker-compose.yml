services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dev_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Adminer (UI PostgreSQL légère) ──────────────────────────────────────
  # Alternative à pgAdmin : image ~100 Mo vs ~400 Mo, interface simple et rapide.
  adminer:
    image: adminer:latest
    container_name: dev_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Backend Go (Gin + Air hot-reload) ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dev_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${POSTGRES_DB}
      DB_USER:     ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      GIN_MODE:    debug
      PORT:        ${BACKEND_PORT:-8081}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    volumes:
      - ./backend:/app          # hot-reload : Air surveille les fichiers montés
      - go_cache:/root/.cache   # cache de build entre les restarts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  go_cache:
