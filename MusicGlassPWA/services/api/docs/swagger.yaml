basePath: /
definitions:
  handlers.AuthTokensResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  handlers.CreatePlaylistRequest:
    properties:
      description:
        example: Pour se détendre
        maxLength: 500
        type: string
      name:
        example: Ma playlist du soir
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      error:
        type: string
      status:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      password:
        example: myS3cretPass
        maxLength: 128
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  handlers.RefreshRequest:
    properties:
      refresh_token:
        example: xYzRefreshToken
        type: string
    required:
    - refresh_token
    type: object
  handlers.SendFriendRequestBody:
    properties:
      addressee_id:
        example: 42
        minimum: 1
        type: integer
    required:
    - addressee_id
    type: object
  handlers.SetLikeVisibilityRequest:
    properties:
      is_public:
        example: true
        type: boolean
    required:
    - is_public
    type: object
  handlers.SignupRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      name:
        example: Alice
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: myS3cretPass
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  handlers.SongRequest:
    properties:
      album:
        example: Whenever You Need Somebody
        maxLength: 255
        type: string
      artist:
        example: Rick Astley
        maxLength: 255
        minLength: 1
        type: string
      cover_url:
        example: https://i.scdn.co/image/ab67616d0000b273
        type: string
      duration_ms:
        example: 213573
        minimum: 0
        type: integer
      external_id:
        example: spotify:track:4uLU6hMCjMI75M1A2tKUQC
        maxLength: 255
        minLength: 1
        type: string
      title:
        example: Never Gonna Give You Up
        maxLength: 255
        minLength: 1
        type: string
    required:
    - artist
    - external_id
    - title
    type: object
  handlers.UpdatePlaylistRequest:
    properties:
      description:
        example: Description mise à jour
        maxLength: 500
        type: string
      is_public:
        example: false
        type: boolean
      name:
        example: Ma playlist
        maxLength: 255
        minLength: 1
        type: string
    type: object
  handlers.UpdateProfileRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      first_name:
        example: Alice
        maxLength: 100
        minLength: 1
        type: string
      last_name:
        example: Dupont
        maxLength: 100
        minLength: 1
        type: string
    type: object
  services.FriendInfo:
    properties:
      email:
        type: string
      name:
        type: string
      user_id:
        type: integer
    type: object
  services.Friendship:
    properties:
      addressee_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      requester_id:
        type: integer
      status:
        description: '"pending" | "accepted"'
        type: string
    type: object
  services.Like:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_public:
        type: boolean
      song:
        $ref: '#/definitions/services.Song'
    type: object
  services.ListenSession:
    properties:
      code:
        type: string
      created_at:
        type: string
      host_id:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
    type: object
  services.Playlist:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_public:
        type: boolean
      name:
        type: string
      songs:
        items:
          $ref: '#/definitions/services.PlaylistSong'
        type: array
      updated_at:
        type: string
    type: object
  services.PlaylistSong:
    properties:
      added_at:
        type: string
      entry_id:
        type: integer
      position:
        type: integer
      song:
        $ref: '#/definitions/services.Song'
    type: object
  services.PlaylistSummary:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_public:
        type: boolean
      name:
        type: string
      song_count:
        type: integer
      updated_at:
        type: string
    type: object
  services.Song:
    properties:
      album:
        type: string
      artist:
        type: string
      cover_url:
        type: string
      duration_ms:
        type: integer
      external_id:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  services.User:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      name:
        type: string
    type: object
info:
  contact: {}
  description: API backend pour gestion des utilisateurs, likes, playlists et écoute
    partagée en temps réel
  title: Music API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Payload login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthTokensResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Connecte un utilisateur
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Payload refresh
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthTokensResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Renouvelle les tokens
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      parameters:
      - description: Payload signup
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/services.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Crée un compte utilisateur
      tags:
      - auth
  /health:
    get:
      description: Vérifie que l'API et la base PostgreSQL sont accessibles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Vérifie l'état du service
      tags:
      - health
  /sessions:
    post:
      description: Retourne un code à 8 caractères à partager avec les amis.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/services.ListenSession'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Crée une session d'écoute partagée
      tags:
      - sessions
  /sessions/{code}:
    delete:
      description: Marque la session inactive et déconnecte tous les participants
        WebSocket.
      parameters:
      - description: Code de la session
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Session introuvable ou n'appartient pas à cet utilisateur
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Termine une session (hôte uniquement)
      tags:
      - sessions
    get:
      parameters:
      - description: Code de la session (8 caractères)
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.ListenSession'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Récupère les informations d'une session active
      tags:
      - sessions
  /users/{user_id}/friends:
    get:
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.FriendInfo'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Liste les amis de l'utilisateur
      tags:
      - friends
  /users/{user_id}/friends/{friend_id}:
    delete:
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      - description: ID de l'ami à supprimer
        in: path
        name: friend_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Supprime un ami
      tags:
      - friends
  /users/{user_id}/friends/requests:
    get:
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.Friendship'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Liste les demandes d'amitié reçues en attente
      tags:
      - friends
    post:
      consumes:
      - application/json
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      - description: ID du destinataire
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SendFriendRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/services.Friendship'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Demande déjà existante
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Envoie une demande d'amitié
      tags:
      - friends
  /users/{user_id}/friends/requests/{request_id}:
    delete:
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      - description: ID de la demande
        in: path
        name: request_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Refuse ou annule une demande d'amitié
      tags:
      - friends
  /users/{user_id}/friends/requests/{request_id}/accept:
    post:
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      - description: ID de la demande
        in: path
        name: request_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.Friendship'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Accepte une demande d'amitié
      tags:
      - friends
  /users/{user_id}/likes:
    get:
      description: Retourne uniquement les likes de l'utilisateur authentifié. Privé
        par défaut.
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.Like'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Liste les musiques likées par l'utilisateur
      tags:
      - likes
    post:
      consumes:
      - application/json
      description: Ajoute la musique aux favoris. La musique est créée si elle n'existe
        pas encore.
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      - description: Métadonnées de la musique à liker
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SongRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/services.Like'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Musique déjà likée
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Like une musique (privé par défaut)
      tags:
      - likes
  /users/{user_id}/likes/{like_id}:
    delete:
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      - description: ID du like
        in: path
        name: like_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retire un like
      tags:
      - likes
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      - description: ID du like
        in: path
        name: like_id
        required: true
        type: integer
      - description: Nouvelle visibilité
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SetLikeVisibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.Like'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change la visibilité d'un like (public / privé)
      tags:
      - likes
  /users/{user_id}/playlists:
    get:
      description: Retourne uniquement les playlists de l'utilisateur authentifié,
        avec le nombre de musiques.
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.PlaylistSummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Liste les playlists de l'utilisateur
      tags:
      - playlists
    post:
      consumes:
      - application/json
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      - description: Données de la playlist
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreatePlaylistRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/services.Playlist'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Crée une playlist (privée par défaut)
      tags:
      - playlists
  /users/{user_id}/playlists/{playlist_id}:
    delete:
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      - description: ID de la playlist
        in: path
        name: playlist_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Supprime une playlist
      tags:
      - playlists
    get:
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: user_id
        required: true
        type: integer
      - description: ID de la playlist
        in: path
        name: playlist_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.Playlist'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
